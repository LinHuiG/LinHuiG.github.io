name: Build and deploy blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.167.0'
  TZ: Asia/Shanghai

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Import approved Transformer article
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && hashFiles('transformer-publication.zip') != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "716585bb0434548ac4bf3bd1008227f1f194de56c8fadd8e52335f2b62df09f5  transformer-publication.zip" | sha256sum --check --strict
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          expected = ['THIRD_PARTY_NOTICES.md', 'assets/css/extended/mermaid.css', 'assets/js/mermaid-loader.js', 'content/posts/transformer-notes/index.md', 'content/posts/transformer-notes/transformer-assets/rope-rotation.svg', 'layouts/_markup/render-codeblock-mermaid.html', 'layouts/_partials/mermaid.html', 'layouts/baseof.html', 'static/vendor/mermaid/LICENSE', 'static/vendor/mermaid/mermaid-10.9.3.min.js']
          with zipfile.ZipFile('transformer-publication.zip') as z:
              assert sorted(z.namelist()) == expected
              for name in expected:
                  path = Path(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(z.read(name))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content/posts/transformer-notes assets/css/extended/mermaid.css assets/js/mermaid-loader.js layouts static/vendor/mermaid THIRD_PARTY_NOTICES.md
          git rm -- transformer-publication.zip
          git commit -m "Publish approved Transformer article with diagrams"
          git push origin HEAD:main
      - name: Install pinned Hugo
        shell: bash
        run: |
          set -euo pipefail
          asset="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location "$release/$asset" -o "$RUNNER_TEMP/$asset"
          curl --fail --silent --show-error --location "$release/hugo_${HUGO_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $asset$" checksums.txt | sha256sum --check --strict)
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Build
        env:
          GISCUS_REPO: ${{ github.repository }}
          GISCUS_REPO_ID: ${{ vars.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY }}
          GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}
        run: hugo --gc --minify --panicOnWarning --cacheDir "$RUNNER_TEMP/hugo-cache"
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
