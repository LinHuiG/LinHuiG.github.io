<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="640" viewBox="0 0 1060 640" role="img" aria-label="SecureCRT Bridge 架构：DLL 从旁接入现有 SSH，会话保持原有界面"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52706b"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#203b35} .label{font-size:18px} .title{font-size:23px;font-weight:600} .note{font-size:17px;fill:#526b63} .line{fill:none;stroke:#52706b;stroke-width:2.2;marker-end:url(#a)} .both{marker-start:url(#a)} .dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" rx="16" fill="#f7faf7"/>
