<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="914" viewBox="0 0 1160 914" role="img" aria-label="命令数据流程：DLL 轮询任务与 CLI 查询结果并行进行"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52706b"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#203b35} .label{font-size:18px} .title{font-size:23px;font-weight:600} .note{font-size:17px;fill:#526b63} .line{fill:none;stroke:#52706b;stroke-width:2.2;marker-end:url(#a)} .both{marker-start:url(#a)} .dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" rx="16" fill="#f7faf7"/><rect x="20" y="30" width="170" height="55" rx="12" fill="#e8f0e5" stroke="#8eaa91" stroke-width="1.5"/><text x="105" y="64.5" text-anchor="middle" class="title">AI / CLI</text><path d="M105 85V885" stroke="#becfc2" stroke-dasharray="5 6"/><rect x="300" y="30" width="170" height="55" rx="12" fill="#e8f0e5" stroke="#8eaa91" stroke-width="1.5"/><text x="385" y="64.5" text-anchor="middle" class="title">Rust Broker</text><path d="M385 85V885" stroke="#becfc2" stroke-dasharray="5 6"/><rect x="625" y="30" width="170" height="55" rx="12" fill="#e8f0e5" stroke="#8eaa91" stroke-width="1.5"/><text x="710" y="64.5" text-anchor="middle" class="title">Rust DLL</text><path d="M710 85V885" stroke="#becfc2" stroke-dasharray="5 6"/><rect x="950" y="30" width="170" height="55" rx="12" fill="#e8f0e5" stroke="#8eaa91" stroke-width="1.5"/><text x="1035" y="64.5" text-anchor="middle" class="title">SSH 会话</text><path d="M1035 85V885" stroke="#becfc2" stroke-dasharray="5 6"/><path d="M105 150H385" class="line"/><text x="245" y="138" text-anchor="middle" class="label">POST exec：提交命令</text><path d="M385 200H105" class="line dash"/><text x="245" y="188" text-anchor="middle" class="label">返回任务 ID（queued）</text><rect x="22" y="250" width="1118" height="604" rx="10" fill="none" stroke="#88a27c" stroke-width="2"/><text x="580" y="280" text-anchor="middle" class="title">以下两个分支并行进行</text><rect x="305" y="298" width="490" height="135" rx="8" fill="#eaf0e3" opacity=".8"/><text x="550" y="325" text-anchor="middle" class="note">DLL 空闲时约每 200ms 轮询一次</text><path d="M710 365H385" class="line"/><text x="547.5" y="353" text-anchor="middle" class="label">POST /actor/poll：屏幕 + 查询任务</text><path d="M385 416H710" class="line dash"/><text x="547.5" y="404" text-anchor="middle" class="label">任务 / 暂无任务</text><path d="M710 490H1035" class="line"/><text x="872.5" y="478" text-anchor="middle" class="label">发送命令：Screen.Send</text><path d="M1035 552H710" class="line dash"/><text x="872.5" y="540" text-anchor="middle" class="label">ReadString：输出 + 结束标记</text><path d="M710 621H385" class="line"/><text x="547.5" y="609" text-anchor="middle" class="label">POST /actor/result：结果 + 退出码</text><path d="M22 664H1140" stroke="#88a27c" stroke-dasharray="7 5"/><text x="580" y="700" text-anchor="middle" class="note">CLI 等待期间约每 150ms 查询结果；--async 立即返回</text><path d="M105 759H385" class="line"/><text x="245" y="747" text-anchor="middle" class="label">GET /jobs/{id}</text><path d="M385 817H105" class="line dash"/><text x="245" y="805" text-anchor="middle" class="label">状态 / 已完成的结果</text></svg>