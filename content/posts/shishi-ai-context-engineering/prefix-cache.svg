<svg xmlns="http://www.w3.org/2000/svg" width="960" height="692" viewBox="0 0 960 692" role="img" aria-labelledby="title desc">
<title id="title">相同前缀，为 KV Cache 复用创造条件</title>
<desc id="desc">两次请求使用相同的系统提示词和稳定背景，不同的增量消息位于后部。同一模型、缓存有效且服务支持跨请求复用并命中时，可以复用前缀的Key和Value，减少prefill重复计算。新增输入和输出仍需计算。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#637b8e"/></marker>
</defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#203448}.edge{fill:none;stroke:#637b8e;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}.dashed{stroke-dasharray:7 6}</style>
<rect x="1" y="1" width="958" height="690" rx="22" fill="#f7f9fc" stroke="#dce4ec"/>

<text x="48" y="39" font-size="20" style="fill:#526779" text-anchor="start" font-weight="600">SHISHI  /  02  前缀缓存</text>
<text x="48" y="84" font-size="32" style="fill:#203448" text-anchor="start" font-weight="700">相同前缀，为 KV Cache 复用创造条件</text>
<rect x="184" y="142" width="520" height="280" rx="14" fill="#edf5f1" stroke="#9ebfb4" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="444" y="127" font-size="24" style="fill:#277568" text-anchor="middle" font-weight="600">可复用的相同 token 前缀</text>
<text x="48" y="214" font-size="25" style="fill:#526779" text-anchor="start" font-weight="600">请求 1</text>
<text x="48" y="362" font-size="25" style="fill:#526779" text-anchor="start" font-weight="600">请求 2</text>
<rect x="200" y="166" width="488" height="86" rx="14" fill="#fff" stroke="#9ebfb4" stroke-width="1.6"/>
<text x="444.0" y="218.0" font-size="26" style="fill:#203448" text-anchor="middle" font-weight="650">系统提示词 + 稳定背景</text>
<rect x="712" y="166" width="200" height="86" rx="14" fill="#edf2fa" stroke="#bccce4" stroke-width="1.6"/>
<text x="812.0" y="218.0" font-size="25" style="fill:#203448" text-anchor="middle" font-weight="650">增量消息 A</text>
<text x="444" y="288" font-size="24" style="fill:#277568" text-anchor="middle" font-weight="400">前缀 token 序列一致</text>
<rect x="200" y="314" width="488" height="86" rx="14" fill="#fff" stroke="#9ebfb4" stroke-width="1.6"/>
<text x="444.0" y="366.0" font-size="26" style="fill:#203448" text-anchor="middle" font-weight="650">系统提示词 + 稳定背景</text>
<rect x="712" y="314" width="200" height="86" rx="14" fill="#edf2fa" stroke="#bccce4" stroke-width="1.6"/>
<text x="812.0" y="366.0" font-size="25" style="fill:#203448" text-anchor="middle" font-weight="650">增量消息 B</text>
<path d="M444 422V482" class="edge"/>
<text x="470" y="458" font-size="22" style="fill:#526779" text-anchor="start" font-weight="400">服务端缓存命中</text>
<rect x="48" y="482" width="864" height="122" rx="14" fill="#edf2fa" stroke="#bccce4" stroke-width="1.6"/>
<text x="480" y="529" font-size="30" style="fill:#486caa" text-anchor="middle" font-weight="650">复用前缀的 Key / Value</text>
<text x="480" y="570" font-size="24" style="fill:#526779" text-anchor="middle" font-weight="400">减少 prefill 重复计算；新输入与输出继续计算</text>
<text x="480" y="652" font-size="22" style="fill:#526779" text-anchor="middle" font-weight="400">同一模型、缓存有效且服务支持跨请求复用时生效</text>
</svg>
