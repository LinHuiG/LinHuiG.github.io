{{ define "main" }}
<header class="page-header"><h1>{{ .Title }}</h1></header>
<div id="searchbox" class="searchbox">
  <label for="searchInput" class="search-help">输入标题、关键词或正文内容</label>
  <input id="searchInput" type="search" placeholder="搜索文章" aria-label="搜索文章" autocomplete="off" maxlength="100" disabled>
  <p id="searchStatus" class="search-status" role="status" aria-live="polite">正在载入文章索引…</p>
  <ul id="searchResults" class="searchResults" aria-label="搜索结果"></ul>
</div>
<noscript><p>搜索需要 JavaScript。你也可以浏览<a href="{{ "archives/" | relURL }}">文章归档</a>。</p></noscript>
{{ end }}
